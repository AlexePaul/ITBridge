name: Deploy

# A push to a release branch deploys it. CI runs first as a called workflow rather than a separate
# one, so the checks and the deploy are a single run in the Actions tab and the deploy job simply
# never starts when something is red.
on:
  push:
    branches: [release/prod, release/stage]

# One deploy per environment at a time, and never cancel one that is already running: a deploy
# interrupted between `migration:run` and `pm2 reload` leaves the schema ahead of the code that
# is serving, which is the one state neither half can recover from on its own.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  # Required for the OIDC token AWS trades for temporary credentials. Without it the role
  # assumption fails with a message about a missing token, not about permissions.
  id-token: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve the target environment
        id: target
        run: |
          case "${{ github.ref_name }}" in
            release/prod)  echo "env=prod"  >> "$GITHUB_OUTPUT" ;;
            release/stage) echo "env=stage" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::${{ github.ref_name }} is not a deployable branch"; exit 1 ;;
          esac

      # No stored AWS keys: the role is assumed through OIDC, and its trust policy is scoped to
      # this repository's release branches, so a run on any other ref cannot obtain credentials.
      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run the deploy on the instance
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          TARGET: ${{ steps.target.outputs.env }}
        run: |
          set -euo pipefail

          # `sudo -iu deploy` is load-bearing: SSM runs commands as root, and a root-owned
          # node_modules or a second PM2 daemon under root would break every later deploy while
          # this one appears to succeed.
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $TARGET ${GITHUB_SHA::7}" \
            --timeout-seconds 1800 \
            --parameters commands="sudo -iu deploy /srv/itbridge/deploy.sh $TARGET" \
            --query Command.CommandId --output text)

          echo "SSM command: $COMMAND_ID"

          # `aws ssm wait command-executed` gives up after 100 seconds, which is far shorter than
          # an install plus a build, so it reports failure on a deploy that is going fine. Poll.
          STATUS=Pending
          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          echo "--- stdout ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          echo "--- stderr ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text

          echo "status: $STATUS"
          [ "$STATUS" = "Success" ]

      # `/ready` rather than `/health`: it checks Postgres and S3, so it fails on a deploy that
      # started a process against a database the migration never reached.
      - name: Check the deployed instance answers
        env:
          TARGET: ${{ steps.target.outputs.env }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "prod" ]; then
            HOST=api.itbridgeschool.com
          else
            HOST=api-stage.itbridgeschool.com
          fi
          for _ in $(seq 1 12); do
            if curl -fsS "https://$HOST/ready" > /dev/null; then
              echo "$HOST is ready"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$HOST did not become ready after the deploy"
          exit 1
