# Infrastructură locală de dezvoltare. Aplicația NU rulează în Docker — nici aici, nici în
# producție (vezi docs/epics/E01-infrastructura-medii.md). Backend-ul și frontend-ul se pornesc
# direct pe Node și se conectează la Postgres pe localhost:5432.

services:
  postgres:
    image: postgres:17-alpine
    container_name: itbridge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-itbridge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password}
      POSTGRES_DB: ${DB_NAME:-itbridge_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-itbridge} -d ${DB_NAME:-itbridge_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO speaks the S3 API, so the application code path is the real one: same SDK, same
  # PutObject/GetObject calls, only a different endpoint. Without it, issuing an invoice cannot be
  # exercised locally at all — it needs a bucket to upload the PDF to — and `pdf.service.ts` never
  # actually produces a PDF in any run you can verify.
  minio:
    image: minio/minio:latest
    container_name: itbridge_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-itbridge}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-dev_password}
    # Overridable because 9000 and 9001 are popular: plenty of other local stacks already hold
    # them. Set MINIO_PORT / MINIO_CONSOLE_PORT in `.env` when they collide.
    ports:
      - "${MINIO_PORT:-9000}:9000" # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: creates the bucket and exits. `docker compose up -d` leaves it in state `exited (0)`,
  # which is expected — there is nothing for it to keep doing.
  minio-init:
    image: minio/mc:latest
    container_name: itbridge_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-itbridge-local}
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-itbridge}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-dev_password}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$AWS_S3_BUCKET &&
      echo 'bucket ready: '$$AWS_S3_BUCKET
      "

volumes:
  postgres_data:
  minio_data:
